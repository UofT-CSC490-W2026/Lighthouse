[project]
name = "eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.42.77",
  "datasets>=4.8.4",
  "swebench>=4.1.0",
]

[project.scripts]
eval = "eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval"]
