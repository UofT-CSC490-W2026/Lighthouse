[project]
name = "embedding"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["boto3>=1.35", "openai>=1.0", "shared"]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedding"]
