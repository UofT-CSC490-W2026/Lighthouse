name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-fail-under=0 --cov-report=xml --cov-report=term-missing

      - name: Build coverage summary
        run: |
          python <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage.xml").getroot()
          coverage = float(root.attrib["line-rate"]) * 100
          percent = f"{coverage:.2f}%"

          color = "red"
          if coverage >= 90:
              color = "brightgreen"
          elif coverage >= 80:
              color = "yellow"
          elif coverage >= 70:
              color = "orange"

          readme_block = f"![Coverage](https://img.shields.io/badge/coverage-{percent.replace('%', '%25')}-{color})"

          pr_body = "\n".join(
              [
                  "## Test Coverage",
                  "",
                  f"- Total line coverage: **{percent}**",
                  "",
                  "_Generated from `pytest --cov` in CI._",
              ]
          )

          pathlib.Path("coverage-readme.md").write_text(readme_block + "\n", encoding="utf-8")
          pathlib.Path("coverage-comment.md").write_text(pr_body + "\n", encoding="utf-8")
          PY

      - name: Update README coverage section
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python <<'PY'
          import pathlib

          readme_path = pathlib.Path("README.md")
          start = "<!-- coverage:start -->"
          end = "<!-- coverage:end -->"
          replacement = pathlib.Path("coverage-readme.md").read_text(encoding="utf-8").strip()

          content = readme_path.read_text(encoding="utf-8")
          start_idx = content.index(start) + len(start)
          end_idx = content.index(end)

          updated = content[:start_idx] + "\n" + replacement + "\n" + content[end_idx:]
          readme_path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit README coverage update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet README.md; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update coverage in README"
          git push

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("coverage-comment.md", "utf8");
            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const marker = "## Test Coverage";

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            const existing = comments.find(
              (comment) =>
                comment.user?.type === "Bot" &&
                comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
