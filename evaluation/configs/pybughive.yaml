models:
  - "bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0"

context_providers:
  - "none"
  - "lighthouse"

dataset:
  adapter: "pybughive"
  # path: "/path/to/local/pybughive-clone"  # required: local PyBugHive repo checkout
  max_instances: 50

num_runs: 3
search_service_url: "http://localhost:8002"
output_dir: "results/pybughive/"
workspace_cache_dir: "../.cache/workspaces"
concurrency: 4

metadata:
  index_registry: "datasets/pybughive/index_registry.json"
