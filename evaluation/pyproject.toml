[project]
name = "lighthouse-eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "shared",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "boto3>=1.35",
  "datasets>=3.0",
  "pyyaml>=6.0",
]

[project.scripts]
lighthouse-eval = "lighthouse_eval.cli.run_eval:main"
lighthouse-eval-index = "lighthouse_eval.cli.index_dataset:main"

[tool.uv.sources]
shared = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "pytest-json-report>=1.5",
  "pytest-asyncio>=0.24",
  "ruff>=0.15.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lighthouse_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src/lighthouse_eval", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
