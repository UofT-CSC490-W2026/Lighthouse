name: lighthouse

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_USER: lighthouse
      POSTGRES_PASSWORD: lighthouse
      POSTGRES_DB: lighthouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lighthouse -d lighthouse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/usr/bin/mc alias set myminio http://localhost:9000 minioadmin minioadmin > /dev/null 2>&1 && /usr/bin/mc ready myminio",
        ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  milvus:
    image: milvusdb/milvus:v2.6.12
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s

  # Attu — Milvus admin UI (https://github.com/zilliztech/attu). Open http://localhost:8088
  attu:
    image: zilliz/attu:v2.6
    ports:
      - "8088:3000"
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      milvus:
        condition: service_healthy

  temporal:
    image: temporalio/temporal:latest
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal_data:/home/temporal
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - services/ingestion/.env
    environment:
      POSTGRES_DSN: postgresql://lighthouse:lighthouse@postgres:5432/lighthouse
      MILVUS_URI: http://milvus:19530
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestion-worker:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    command: ["python", "-m", "ingestion.temporal.worker"]
    env_file:
      - services/ingestion/.env
    environment:
      POSTGRES_DSN: postgresql://lighthouse:lighthouse@postgres:5432/lighthouse
      MILVUS_URI: http://milvus:19530
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      temporal:
        condition: service_healthy

  search:
    build:
      context: .
      dockerfile: services/search/Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - services/search/.env
    environment:
      POSTGRES_DSN: postgresql://lighthouse:lighthouse@postgres:5432/lighthouse
      MILVUS_URI: http://milvus:19530
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp_server:
    build:
      context: .
      dockerfile: services/mcp_server/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - services/mcp_server/.env
    environment:
      POSTGRES_DSN: postgresql://lighthouse:lighthouse@postgres:5432/lighthouse
      SEARCH_SERVICE_URL: http://search:8002
      INGESTION_SERVICE_URL: http://ingestion:8001
    depends_on:
      postgres:
        condition: service_healthy
      search:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      mcp_server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
  temporal_data:
