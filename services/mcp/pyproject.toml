[project]
name = "mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115",
  "fastmcp<3",
  "httpx>=0.27",
  "cryptography>=42.0",
  "asyncpg>=0.29",
  "boto3>=1.35",
  "peewee>=3.17",
  "psycopg2-binary>=2.9",
  "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "ruff>=0.15.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
