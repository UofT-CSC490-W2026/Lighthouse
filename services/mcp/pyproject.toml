[project]
name = "mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115",
  "httpx>=0.27",
  "cryptography>=42.0",
  "asyncpg>=0.29",
  "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp"]
