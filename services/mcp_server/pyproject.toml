[project]
name = "mcp-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "db",
  "shared",
  "fastapi[standard]>=0.115",
  "fastmcp<3",
  "httpx>=0.27",
  "cryptography>=42.0",
  "asyncpg>=0.29",
  "boto3>=1.35",
  "pydantic-settings>=2.0",
]

[tool.uv.sources]
db = { workspace = true }
shared = { workspace = true }

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.15.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src/mcp_server", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
