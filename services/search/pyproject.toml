[project]
name = "search"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.7",
    "fastapi[standard]>=0.115",
    "cohere>=5.15.0",
    "shared",
    "db",
    "vectordb",
    "embedding",
    "llm",
    "pydantic-settings>=2.0",
]

[tool.uv.sources]
shared = { workspace = true }
db = { workspace = true }
vectordb = { workspace = true }
embedding = { workspace = true }
llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/search"]
