[project]
name = "ingestion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["temporalio>=1.7", "fastapi[standard]>=0.115", "shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.uv.sources]
shared = { workspace = true }
