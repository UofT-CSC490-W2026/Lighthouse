[project]
name = "lighthouse"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
  "services/ingestion",
  "services/search",
  "services/mcp_server",
  "packages/shared",
  "packages/vectordb",
  "packages/db",
  "packages/embedding",
]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.7",
  "testcontainers[milvus,postgres]>=4.14.2",
  "ty>=0.0.24",
]

[tool.ruff]
extend-exclude = ["assignments", "infra", "docs"]

[tool.ty.src]
exclude = ["assignments", "infra", "docs"]
